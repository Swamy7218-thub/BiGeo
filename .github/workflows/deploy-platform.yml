name: Deploy Platform

on:
  push:
    branches: [main]
    paths:
      - "platform/services/**"
      - "platform/infrastructure/**"
      - ".github/workflows/deploy-platform.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (all|api-gateway|hub-optimizer|route-optimizer)"
        required: false
        default: "all"
      environment:
        description: "Target environment"
        required: false
        default: "prod"

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: bigeo-platform-cluster

jobs:
  # ── Lint & Test ──────────────────────────────────────────────────────────────
  test:
    name: Test Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, hub-optimizer, route-optimizer, booking-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: platform/services/${{ matrix.service }}
        run: pip install -r requirements.txt -r requirements-dev.txt 2>/dev/null || pip install -r requirements.txt

      - name: Lint
        working-directory: platform/services/${{ matrix.service }}
        run: |
          pip install ruff
          ruff check . --select E,F,W --ignore E501

      - name: Type check
        working-directory: platform/services/${{ matrix.service }}
        run: |
          pip install mypy types-requests
          mypy main.py --ignore-missing-imports || true

      - name: Run tests
        working-directory: platform/services/${{ matrix.service }}
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found"

  # ── Build & Push ─────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api_gateway_image: ${{ steps.meta.outputs.api_gateway }}
      hub_optimizer_image: ${{ steps.meta.outputs.hub_optimizer }}
      route_optimizer_image: ${{ steps.meta.outputs.route_optimizer }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA::8}"
          echo "api_gateway=$ECR_REGISTRY/bigeo-platform-api-gateway:$SHA" >> $GITHUB_OUTPUT
          echo "hub_optimizer=$ECR_REGISTRY/bigeo-platform-hub-optimizer:$SHA" >> $GITHUB_OUTPUT
          echo "route_optimizer=$ECR_REGISTRY/bigeo-platform-route-optimizer:$SHA" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API Gateway
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'api-gateway' || github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: platform/services/api-gateway
          push: true
          tags: |
            ${{ steps.meta.outputs.api_gateway }}
            ${{ env.ECR_REGISTRY }}/bigeo-platform-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Hub Optimizer
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'hub-optimizer' || github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: platform/services/hub-optimizer
          push: true
          tags: |
            ${{ steps.meta.outputs.hub_optimizer }}
            ${{ env.ECR_REGISTRY }}/bigeo-platform-hub-optimizer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Route Optimizer
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'route-optimizer' || github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: platform/services/route-optimizer
          push: true
          tags: |
            ${{ steps.meta.outputs.route_optimizer }}
            ${{ env.ECR_REGISTRY }}/bigeo-platform-route-optimizer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Terraform Plan ────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"

      - name: Terraform Init
        working-directory: platform/infrastructure/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: platform/infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: platform/infrastructure/terraform
        run: |
          terraform plan \
            -var="app_image=${{ needs.build.outputs.api_gateway_image }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: platform/infrastructure/terraform/tfplan
          retention-days: 7

  # ── Deploy to ECS ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    needs: [build, terraform-plan]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: platform/infrastructure/terraform

      - name: Terraform Apply
        working-directory: platform/infrastructure/terraform
        run: terraform init && terraform apply -auto-approve tfplan

      - name: Deploy API Gateway to ECS
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition bigeo-platform-api-gateway \
            --query 'taskDefinition' --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "${{ needs.build.outputs.api_gateway_image }}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .registeredAt, .registeredBy, .compatibilities)')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service bigeo-platform-api-gateway \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services bigeo-platform-api-gateway
          echo "Deployment stable"

      - name: Smoke test
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names bigeo-platform-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/health")
            [ "$STATUS" = "200" ] && echo "Health check passed" && exit 0
            sleep 10
          done
          echo "Smoke test failed" && exit 1

  # ── Notify ────────────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send deployment notification
        run: |
          STATUS="${{ needs.deploy.result }}"
          echo "Deployment $STATUS for commit $GITHUB_SHA"
          # Add SES/Slack webhook notification here when ready

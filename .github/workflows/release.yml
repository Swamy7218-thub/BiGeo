name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: job-agent
  ENVIRONMENT: staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: api
            dockerfile: apps/api/Dockerfile
          - repo: sourcing-agent
            dockerfile: apps/agents/Dockerfile
          - repo: scoring-agent
            dockerfile: apps/agents/Dockerfile
          - repo: resume-agent
            dockerfile: apps/agents/Dockerfile
          - repo: submission-agent
            dockerfile: apps/agents/Dockerfile
          - repo: reporting-agent
            dockerfile: apps/agents/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-${{ matrix.repo }}
          TAG: ${{ github.ref_name }}
        run: |
          docker build -f ${{ matrix.dockerfile }} -t "$REGISTRY/$REPO:$TAG" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:$TAG"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new API deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}" \
            --service "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api" \
            --force-new-deployment

# Builds acquahtlabs.in and publishes the static files to the `hostinger` branch.
# Hostinger (hPanel → Websites → Advanced → GIT) pulls that branch into public_html.
name: Deploy acquahtlabs.in

on:
  push:
    branches: [main]
    paths:
      - 'acquaht-website/**'
      - '.github/workflows/deploy-acquaht.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-acquaht
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acquaht-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: acquaht-website/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Push build to the hostinger branch
        working-directory: acquaht-website/out
        run: |
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger

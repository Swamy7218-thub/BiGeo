    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/india-address-graph"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/platform/services/api-gateway"

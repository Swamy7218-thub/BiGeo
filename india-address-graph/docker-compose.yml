version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: iag
      POSTGRES_PASSWORD: iag_secret
      POSTGRES_DB: india_address_graph
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iag -d india_address_graph"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://iag:iag_secret@db:5432/india_address_graph
      APP_ENV: development
      APP_DEBUG: "false"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount data directory for ETL scripts
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  pg_data:
